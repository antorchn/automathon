# =============================================================================
# Hyperparametres de training/rl_training.py : un PPO simple contre un adversaire fixe.
#
# Toute valeur se surcharge en ligne de commande (syntaxe Hydra) :
#   python training/rl_training.py total_timesteps=200000 ppo.learning_rate=3e-4
#   python training/rl_training.py opponent=dummy_bot
#   python training/rl_training.py reward.pain_factor=0.5 unity.num_envs=4
#   python training/rl_training.py --cfg job      # affiche la config finale sans lancer
#   python training/rl_training.py -m ppo.learning_rate=1e-4,3e-4   # un run par valeur
#
# Chaque run enregistre sa config complete dans training/outputs/rl_training/<date>/.hydra/
# Chemins : relatifs a PythonAI/training/ ; un chemin absolu (ex : /dbfs/...) est garde tel quel.
# =============================================================================
defaults:
  - common
  - _self_

# Valeurs par defaut : environ 43 % de victoires contre rush_bot en 3 M de steps (evaluation/benchmark.py, 3 graines,
# de 41 a 44 % selon la graine). Un point de depart, pas un optimum.
opponent: rush_bot             # adversaire pendant tout l'entrainement : un dossier de agents/
total_timesteps: 3000000
seed: null                     # null = aleatoire
device: auto                   # auto | cpu | cuda ("cpu" est souvent le plus rapide pour un MLP)
torch_threads: 2               # threads PyTorch du processus d'apprentissage (null = defaut de PyTorch)

unity:
  num_envs: 8                  # environnements en parallele ; n_steps x num_envs steps par mise a jour

init:
  model: null                  # modele PPO a reprendre (ex : un checkpoint) ; null = from scratch

save:
  model: rl_model.zip                    # modele final
  interrupted: rl_model_interrupted.zip  # sauvegarde de secours sur Ctrl+C
  checkpoint_dir: null                   # null = $AUTOMATHON_CHECKPOINT_DIR, sinon training/checkpoints/
  checkpoint_every: 50000                # en timesteps cumules (tous envs confondus)
  tensorboard: tensorboard               # dossier des logs TensorBoard (null pour desactiver)

# Hyperparametres PPO (stable-baselines3). En reprenant un modele (init.model), ils remplacent
# ceux enregistres dans ce modele.
ppo:
  learning_rate: 3.0e-4
  n_steps: 1024                # steps collectes par env avant chaque mise a jour
  batch_size: 1024             # taille d'un minibatch
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  verbose: 1

# Architecture du reseau, utilisee seulement from scratch. En reprenant un modele (init.model),
# c'est son architecture qui s'applique.
policy_kwargs:
  net_arch: [64, 64]

# Poids de la recompense (core/env/reward_shaping.py)
reward:                        # echelle : une victoire vaut 10, un vaisseau detruit (1 000 PV) aussi
  time_penalty: 0.001          # retire a chaque frame (force l'engagement)
  damage_dealt_coef: 0.01      # x degats infliges
  pain_factor: 0.001           # x degats subis (bas = l'agent ne fuit pas le combat)
  win_bonus: 10.0
  loss_penalty: 10.0
  draw_penalty: 10.0           # match nul : interdit la fuite

hydra:
  run:
    dir: ${training_dir:}/outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${training_dir:}/outputs/${hydra.job.name}/multirun_${now:%Y-%m-%d_%H-%M-%S}
